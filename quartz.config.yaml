# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # ==========================================================================
  # CONFIGURAZIONE GENERALE DEL SITO
  # ==========================================================================
  pageTitle: Home # Modifica "Home" per cambiare il nome principale del sito
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: mysite.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian

  # ==========================================================================
  # TEMA DI INTERFACCIA: TIPOGRAFIA E PALETTE COLORI (TYPEWRITER)
  # ==========================================================================
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#fbf6ee"
        lightgray: "#e6dfd3"
        gray: "#989384"
        darkgray: "#2e2c29"
        dark: "#1a1917"
        secondary: "#c14a34"
        tertiary: "#a46342"
        highlight: "rgba(193, 74, 52, 0.05)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#292522"
        lightgray: "#3c3836"
        gray: "#7c6f64"
        darkgray: "#a89984"
        dark: "#ddc7a1"
        secondary: "#da8548"
        tertiary: "#ea6962"
        highlight: "#1e1b19"
        textHighlight: "#b3aa0288"

# ==========================================================================
# GESTIONE DEI PLUGINS E DEI COMPONENTI DI LAYOUT
# ==========================================================================
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30

  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40

  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right # Posizionamento dell'Indice (TOC) nella colonna di destra
      priority: 30

  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: github:quartz-community/description
    enabled: true
    order: 70

  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: github:quartz-community/citations
    enabled: false
    order: 85

  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90

  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91

  - source: github:quartz-community/roam
    enabled: false
    order: 92

  - source: github:quartz-community/remove-draft
    enabled: true

  - source: github:quartz-community/explicit-publish
    enabled: false

  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45

  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json

  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

  - source: github:quartz-community/alias-redirects
    enabled: true

  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: github:quartz-community/favicon
    enabled: true

  - source: github:quartz-community/og-image
    enabled: true

  - source: github:quartz-community/cname
    enabled: true

  - source: github:quartz-community/canvas-page
    enabled: true

  - source: github:quartz-community/content-page
    enabled: true

  - source: github:quartz-community/folder-page
    enabled: true

  - source: github:quartz-community/tag-page
    enabled: true

  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left # L'albero dei file (Explorer) si trova a sinistra
      priority: 50

  - source: github:quartz-community/graph
    enabled: true # NOTA: È abilitato qui ma lo nascondiamo visivamente tramite custom.scss
    layout:
      position: right
      priority: 10

  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50

  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30

  - source: github:quartz-community/page-title
    enabled: true # [MODIFICA / ELIMINA SCRITTA QUARTZ 5]
    layout: # Cambia "enabled: false" se vuoi eliminare del tutto la scritta
      position: left # senza toccare i file .ts
      priority: 10

  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: github:quartz-community/breadcrumbs
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10

  # ------------------------------------------------------------------------
  # MODIFICA QUI I TUOI LINK DEL FOOTER (PIÈ DI PAGINA)
  # ------------------------------------------------------------------------
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        # Struttura: Nome Visualizzato: URL
        # Puoi eliminare quelli di default e aggiungere i tuoi come nell'esempio sotto:
        GitHub: https://github.com/tuo-username
        LinkedIn: https://linkedin.com/in/tuo-profilo
        Portfolio: https://tuosito.com

  - source: github:quartz-community/recent-notes
    enabled: false

  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50

  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50

# ==========================================================================
# DEFINIZIONE DEI GRUPPI DI STRUTTURA DEL LAYOUT
# ==========================================================================
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
      content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
